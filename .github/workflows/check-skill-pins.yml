name: Check skill pins

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Reject unsupported Python without a traceback
        shell: bash
        run: |
          python3 --version
          status=0
          output=$(./scripts/check_skill_pins.sh 2>&1) || status=$?
          printf '%s\n' "$output"
          test "$status" -ne 0
          grep -Fq 'Python >=3.11 is required' <<< "$output"
          if grep -Eq 'Traceback|ModuleNotFoundError' <<< "$output"; then
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Align skill pins with live app-factory MANIFEST
        run: ./scripts/check_skill_pins.sh
